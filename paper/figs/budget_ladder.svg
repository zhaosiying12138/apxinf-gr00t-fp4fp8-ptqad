<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-label="W4A4 编码预算：待冻结产物核算" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif">
<rect width="100%" height="100%" fill="white"/>
<text x="30" y="38" fill="#183c4d" font-size="23" font-weight="700" text-anchor="start"><tspan dy="0" font-size="23">W4A4 编码预算：待冻结产物核算</tspan></text>
<text x="30" y="67" fill="#667c87" font-size="13" font-weight="400" text-anchor="start"><tspan dy="0" font-size="13">结构审阅稿 · 红色 xxx 为待核验数值；不读取其他配方的预算。</tspan></text>
<rect x="30" y="110" width="1040" height="58" fill="#f4f7f8" stroke="none" rx="5"/>
<text x="48" y="147" fill="#183c4d" font-size="19" font-weight="600" text-anchor="start"><tspan dy="0" font-size="19">BF16 原始权重</tspan></text>
<text x="1000" y="147" fill="#b42318" font-size="22" font-weight="600" text-anchor="end"><tspan dy="0" font-size="22">xxx GB</tspan></text>
<rect x="30" y="182" width="1040" height="58" fill="#f4f7f8" stroke="none" rx="5"/>
<text x="48" y="219" fill="#183c4d" font-size="19" font-weight="600" text-anchor="start"><tspan dy="0" font-size="19">NVFP4 payload 与格式缩放</tspan></text>
<text x="1000" y="219" fill="#b42318" font-size="22" font-weight="600" text-anchor="end"><tspan dy="0" font-size="22">xxx GB</tspan></text>
<rect x="30" y="254" width="1040" height="58" fill="#f4f7f8" stroke="none" rx="5"/>
<text x="48" y="291" fill="#183c4d" font-size="19" font-weight="600" text-anchor="start"><tspan dy="0" font-size="19">未量化权重及补零开销</tspan></text>
<text x="1000" y="291" fill="#b42318" font-size="22" font-weight="600" text-anchor="end"><tspan dy="0" font-size="22">xxx GB</tspan></text>
<rect x="30" y="326" width="1040" height="58" fill="#f4f7f8" stroke="none" rx="5"/>
<text x="48" y="363" fill="#183c4d" font-size="19" font-weight="600" text-anchor="start"><tspan dy="0" font-size="19">完整 BF16 低秩旁路</tspan></text>
<text x="1000" y="363" fill="#b42318" font-size="22" font-weight="600" text-anchor="end"><tspan dy="0" font-size="22">xxx GB</tspan></text>
<rect x="30" y="398" width="1040" height="58" fill="#f4f7f8" stroke="none" rx="5"/>
<text x="48" y="435" fill="#183c4d" font-size="19" font-weight="600" text-anchor="start"><tspan dy="0" font-size="19">含低秩旁路的完整压缩比</tspan></text>
<text x="1000" y="435" fill="#b42318" font-size="22" font-weight="600" text-anchor="end"><tspan dy="0" font-size="22">xxx×</tspan></text>
<text x="32" y="514" fill="#183c4d" font-size="16" font-weight="400" text-anchor="start"><tspan dy="0" font-size="16">最终同时报告物理张量与已知共享别名去重口径；恢复臂完整计入 BF16 旁路。</tspan></text>
<text x="32" y="548" fill="#183c4d" font-size="16" font-weight="400" text-anchor="start"><tspan dy="0" font-size="16">编码预算不是稠密 checkpoint 文件体积、实际显存或延迟。</tspan></text>
</svg>