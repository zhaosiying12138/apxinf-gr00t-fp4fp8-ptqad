<text x="48" y="571" fill="#b97824" font-size="14" font-weight="400" text-anchor="start"><tspan dy="0" font-size="14">π0.5 PT 未使用 state-to-text；输入准备与计算内容不同，浮点入口仅分别报告耗时。</tspan></text>
<text x="48" y="594" fill="#b97824" font-size="13" font-weight="400" text-anchor="start"><tspan dy="0" font-size="13">跨入口不计算加速比；图中耗时比只比较同一 APX π0.5 接口的 BF16 与 NVFP4 路径。</tspan></text>
