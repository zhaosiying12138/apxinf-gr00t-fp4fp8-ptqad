<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="NVFP4 W4A4：权重离线定标，激活逐次量化" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif">
<rect width="100%" height="100%" fill="white"/>
<text x="30" y="38" fill="#183c4d" font-size="23" font-weight="700" text-anchor="start"><tspan dy="0" font-size="23">NVFP4 W4A4：权重离线定标，激活逐次量化</tspan></text>
<text x="30" y="67" fill="#667c87" font-size="13" font-weight="400" text-anchor="start"><tspan dy="0" font-size="13">正式 RTN 配方固定 clip = 1；沿输入维 K 每 16 个元素一块。R4、R8 分别表示 E2M1、E4M3 最近偶数舍入。</tspan></text>
<rect x="30" y="103" width="555" height="367" fill="#f0f6f8" stroke="#2368a0" rx="5"/>
<text x="50" y="138" fill="#2368a0" font-size="21" font-weight="600" text-anchor="start"><tspan dy="0" font-size="21">W4：一次量化并冻结权重</tspan></text>
<text x="50" y="180" fill="#183c4d" font-size="16" font-weight="400" text-anchor="start"><tspan dy="0" font-size="16">输入 W:[N,K]；τ 随权重张量确定</tspan></text>
<text x="50" y="217" fill="#183c4d" font-size="16" font-weight="400" text-anchor="start"><tspan dy="0" font-size="16">τ = FP32(max(max|W| / 448, 2</tspan><tspan dy="-5.12" font-size="11.52">-149</tspan><tspan dy="5.12" font-size="16">))</tspan></text>
<text x="50" y="254" fill="#183c4d" font-size="16" font-weight="400" text-anchor="start"><tspan dy="0" font-size="16">s[b] = R8(max|W[b]| / (6τ))</tspan></text>
<text x="50" y="291" fill="#183c4d" font-size="16" font-weight="400" text-anchor="start"><tspan dy="0" font-size="16">q[b] = R4(W[b] / (s[b] · τ))</tspan></text>
<text x="50" y="328" fill="#183c4d" font-size="16" font-weight="400" text-anchor="start"><tspan dy="0" font-size="16">Wq[b] = FP32(q[b] · FP32(s[b] · τ))</tspan></text>
<text x="50" y="365" fill="#183c4d" font-size="16" font-weight="400" text-anchor="start"><tspan dy="0" font-size="16">选码的除法使用 FP64；解码使用 FP32。</tspan></text>
<text x="50" y="402" fill="#183c4d" font-size="16" font-weight="400" text-anchor="start"><tspan dy="0" font-size="16">量化后写回源 BF16 dtype；该稠密文件</tspan></text>
<text x="50" y="439" fill="#183c4d" font-size="16" font-weight="400" text-anchor="start"><tspan dy="0" font-size="16">用于闭环数值参考，编码预算另外计算。</tspan></text>
<rect x="615" y="103" width="555" height="367" fill="#f0f6f8" stroke="#258577" rx="5"/>
<text x="635" y="138" fill="#258577" font-size="21" font-weight="600" text-anchor="start"><tspan dy="0" font-size="21">A4：每次前向重新量化激活</tspan></text>
<text x="635" y="180" fill="#183c4d" font-size="16" font-weight="400" text-anchor="start"><tspan dy="0" font-size="16">输入 x:[M,K]；二级尺度固定 τ = 1</tspan></text>
<text x="635" y="217" fill="#183c4d" font-size="16" font-weight="400" text-anchor="start"><tspan dy="0" font-size="16">h = F16(x)；按运行契约处理有限溢出</tspan></text>
<text x="635" y="254" fill="#183c4d" font-size="16" font-weight="400" text-anchor="start"><tspan dy="0" font-size="16">s[b] = R8(FP32(max|h[b]| × FP32(1/6)))</tspan></text>
<text x="635" y="291" fill="#183c4d" font-size="16" font-weight="400" text-anchor="start"><tspan dy="0" font-size="16">q[b] = R4(FP32(h[b]) / s[b])</tspan></text>
<text x="635" y="328" fill="#183c4d" font-size="16" font-weight="400" text-anchor="start"><tspan dy="0" font-size="16">Q</tspan><tspan dy="3.68" font-size="11.52">A</tspan><tspan dy="-3.68" font-size="16">(x)[b] = FP32(q[b] · s[b])</tspan></text>
<text x="635" y="365" fill="#183c4d" font-size="16" font-weight="400" text-anchor="start"><tspan dy="0" font-size="16">解码后转回输入 dtype；训练使用 STE。</tspan></text>
<text x="635" y="402" fill="#183c4d" font-size="16" font-weight="400" text-anchor="start"><tspan dy="0" font-size="16">固定二级尺度允许饱和和零尺度下溢；</tspan></text>
<text x="635" y="439" fill="#183c4d" font-size="16" font-weight="400" text-anchor="start"><tspan dy="0" font-size="16">NaN/Inf 拒绝执行，不混入成功结果。</tspan></text>
<rect x="30" y="499" width="1140" height="106" fill="#e8f2ee" stroke="none" rx="5"/>
<text x="50" y="532" fill="#258577" font-size="22" font-weight="600" text-anchor="start"><tspan dy="0" font-size="22">线性主分支：y = Q</tspan><tspan dy="5.06" font-size="15.84">A</tspan><tspan dy="-5.06" font-size="22">(x)(Wq)</tspan><tspan dy="-7.04" font-size="15.84">T</tspan><tspan dy="7.04" font-size="22"> + b</tspan></text>
<text x="50" y="566" fill="#183c4d" font-size="16" font-weight="400" text-anchor="start"><tspan dy="0" font-size="16">479 个权重张量采用 NVFP4；469 个 ordinary Linear 与 7 个 category Linear 接入激活 QDQ。</tspan></text>
<text x="50" y="592" fill="#183c4d" font-size="15" font-weight="400" text-anchor="start"><tspan dy="0" font-size="15">479 个张量中有 3 个 embedding/position 张量仅量化权重；QAD/OPD 的 BF16 旁路独立保留。</tspan></text>
<rect x="30" y="630" width="1140" height="140" fill="#fff6e9" stroke="none" rx="5"/>
<text x="50" y="663" fill="#b97824" font-size="19" font-weight="600" text-anchor="start"><tspan dy="0" font-size="19">边界规则</tspan></text>
<text x="50" y="694" fill="#183c4d" font-size="16" font-weight="400" text-anchor="start"><tspan dy="0" font-size="16">全零权重张量取 τ = 1；s = 0 时仅替换除法分母，解码结果仍为 0。</tspan></text>
<text x="50" y="724" fill="#183c4d" font-size="16" font-weight="400" text-anchor="start"><tspan dy="0" font-size="16">类别层沿 K 补零：K′ = 16 × ceil(K / 16)，两处 K = 132 补到 144；补出的权重为零。</tspan></text>
<text x="50" y="752" fill="#183c4d" font-size="15" font-weight="400" text-anchor="start"><tspan dy="0" font-size="15">E2M1 正幅值：0、0.5、1、1.5、2、3、4、6；E4M3 最大有限幅值：448。</tspan></text>
</svg>