<text x="734" y="189" fill="#183c4d" font-size="11" font-weight="400" text-anchor="middle">0,3</text>
<rect x="768" y="152" width="56" height="46" fill="#d9eee9" stroke="none" rx="5"/>
<text x="796" y="171" fill="#183c4d" font-size="13" font-weight="400" text-anchor="middle">4 B</text>
<text x="796" y="189" fill="#183c4d" font-size="11" font-weight="400" text-anchor="middle">32,0</text>
<rect x="830" y="152" width="56" height="46" fill="#d9eee9" stroke="none" rx="5"/>
<text x="858" y="171" fill="#183c4d" font-size="13" font-weight="400" text-anchor="middle">5 B</text>
<text x="858" y="189" fill="#183c4d" font-size="11" font-weight="400" text-anchor="middle">32,1</text>
<rect x="892" y="152" width="56" height="46" fill="#d9eee9" stroke="none" rx="5"/>
<text x="920" y="171" fill="#183c4d" font-size="13" font-weight="400" text-anchor="middle">6 B</text>
<text x="920" y="189" fill="#183c4d" font-size="11" font-weight="400" text-anchor="middle">32,2</text>
<rect x="954" y="152" width="56" height="46" fill="#d9eee9" stroke="none" rx="5"/>
<text x="982" y="171" fill="#183c4d" font-size="13" font-weight="400" text-anchor="middle">7 B</text>
<text x="982" y="189" fill="#183c4d" font-size="11" font-weight="400" text-anchor="middle">32,3</text>
<rect x="520" y="257" width="56" height="46" fill="#f6e7cb" stroke="none" rx="5"/>
<text x="548" y="276" fill="#183c4d" font-size="13" font-weight="400" text-anchor="middle">8 B</text>
<text x="548" y="294" fill="#183c4d" font-size="11" font-weight="400" text-anchor="middle">64,0</text>
<rect x="582" y="257" width="56" height="46" fill="#f6e7cb" stroke="none" rx="5"/>
<text x="610" y="276" fill="#183c4d" font-size="13" font-weight="400" text-anchor="middle">9 B</text>
<text x="610" y="294" fill="#183c4d" font-size="11" font-weight="400" text-anchor="middle">64,1</text>
<rect x="644" y="257" width="56" height="46" fill="#f6e7cb" stroke="none" rx="5"/>
<text x="672" y="276" fill="#183c4d" font-size="13" font-weight="400" text-anchor="middle">10 B</text>
<text x="672" y="294" fill="#183c4d" font-size="11" font-weight="400" text-anchor="middle">64,2</text>
<rect x="706" y="257" width="56" height="46" fill="#f6e7cb" stroke="none" rx="5"/>
<text x="734" y="276" fill="#183c4d" font-size="13" font-weight="400" text-anchor="middle">11 B</text>
<text x="734" y="294" fill="#183c4d" font-size="11" font-weight="400" text-anchor="middle">64,3</text>
<rect x="768" y="257" width="56" height="46" fill="#e6def2" stroke="none" rx="5"/>
<text x="796" y="276" fill="#183c4d" font-size="13" font-weight="400" text-anchor="middle">12 B</text>
<text x="796" y="294" fill="#183c4d" font-size="11" font-weight="400" text-anchor="middle">96,0</text>
<rect x="830" y="257" width="56" height="46" fill="#e6def2" stroke="none" rx="5"/>
<text x="858" y="276" fill="#183c4d" font-size="13" font-weight="400" text-anchor="middle">13 B</text>
<text x="858" y="294" fill="#183c4d" font-size="11" font-weight="400" text-anchor="middle">96,1</text>
<rect x="892" y="257" width="56" height="46" fill="#e6def2" stroke="none" rx="5"/>
<text x="920" y="276" fill="#183c4d" font-size="13" font-weight="400" text-anchor="middle">14 B</text>
<text x="920" y="294" fill="#183c4d" font-size="11" font-weight="400" text-anchor="middle">96,2</text>
<rect x="954" y="257" width="56" height="46" fill="#e6def2" stroke="none" rx="5"/>
<text x="982" y="276" fill="#183c4d" font-size="13" font-weight="400" text-anchor="middle">15 B</text>
<text x="982" y="294" fill="#183c4d" font-size="11" font-weight="400" text-anchor="middle">96,3</text>
<text x="520" y="375" fill="#183c4d" font-size="13" font-weight="400" text-anchor="start">第 16～31 字节依次放 r=1,33,65,97 的 b=0…3。</text>
<text x="520" y="399" fill="#183c4d" font-size="13" font-weight="400" text-anchor="start">b=4…7 的下一个 tile 从字节 512 开始。</text>
<rect x="30" y="429" width="1020" height="112" fill="#f1f6f8" stroke="none" rx="5"/>
<text x="48" y="457" fill="#2368a0" font-size="16" font-weight="400" text-anchor="start">KB = K / 16；P = 512 × ceil(KB / 4)；// 表示整数除法。</text>
<text x="48" y="487" fill="#183c4d" font-size="18" font-weight="400" text-anchor="start">offset(r,b) = P × (r // 128) + 512 × (b // 4)</text>
<text x="48" y="517" fill="#183c4d" font-size="17" font-weight="400" text-anchor="start">                         + 16 × (r % 32) + 4 × ((r // 32) % 4) + (b % 4)</text>
<text x="30" y="573" fill="#183c4d" font-size="15" font-weight="400" text-anchor="start">例：(0,0)→0；(32,0)→4；(1,0)→16；(3,2)→50；(0,5)→513。</text>
<text x="30" y="603" fill="#183c4d" font-size="13" font-weight="400" text-anchor="start">这里只说明可验证的布局映射。普通行主序的同一行相邻块本来就连续；不据此猜测内部 warp 读法。</text>
</svg>