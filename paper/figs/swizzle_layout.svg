<text x="734" y="276" fill="#183c4d" font-size="13" font-weight="400" text-anchor="middle"><tspan dy="0" font-size="13">11 B</tspan></text>
<text x="734" y="294" fill="#183c4d" font-size="11" font-weight="400" text-anchor="middle"><tspan dy="0" font-size="11">64,3</tspan></text>
