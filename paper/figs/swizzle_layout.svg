<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="Noto Sans CJK SC,system-ui,sans-serif"><rect width="900" height="500" fill="white"/><text x="20" y="30" font-size="15" font-weight="600" fill="#1a1a2e">NVFP4 块缩放的物理布局原理（静态示意，8 行 × 8 块）</text><text x="164" y="66" font-size="13" font-weight="600" text-anchor="middle" fill="#1a1a2e">逻辑视图 scale[row, block]</text><text x="330" y="66" font-size="13" font-weight="600" fill="#1a1a2e">偏移公式</text><text x="730" y="66" font-size="13" font-weight="600" text-anchor="middle" fill="#1a1a2e">物理缓冲（两个 512B slab）</text><rect x="64" y="100" width="22" height="22" rx="3" fill="#e5a8a8" stroke="#8fa3b8"/><rect x="89" y="100" width="22" height="22" rx="3" fill="#e5bfa8" stroke="#8fa3b8"/><rect x="114" y="100" width="22" height="22" rx="3" fill="#e5d7a8" stroke="#8fa3b8"/><rect x="139" y="100" width="22" height="22" rx="3" fill="#dce5a8" stroke="#8fa3b8"/><rect x="164" y="100" width="22" height="22" rx="3" fill="#c4e5a8" stroke="#8fa3b8"/><rect x="189" y="100" width="22" height="22" rx="3" fill="#ade5a8" stroke="#8fa3b8"/><rect x="214" y="100" width="22" height="22" rx="3" fill="#a8e5ba" stroke="#8fa3b8"/><rect x="239" y="100" width="22" height="22" rx="3" fill="#a8e5d2" stroke="#8fa3b8"/><rect x="64" y="125" width="22" height="22" rx="3" fill="#e5d8a8" stroke="#8fa3b8"/><rect x="89" y="125" width="22" height="22" rx="3" fill="#dbe5a8" stroke="#8fa3b8"/><rect x="114" y="125" width="22" height="22" rx="3" fill="#c3e5a8" stroke="#8fa3b8"/><rect x="139" y="125" width="22" height="22" rx="3" fill="#ace5a8" stroke="#8fa3b8"/><rect x="164" y="125" width="22" height="22" rx="3" fill="#a8e5bb" stroke="#8fa3b8"/><rect x="189" y="125" width="22" height="22" rx="3" fill="#a8e5d3" stroke="#8fa3b8"/><rect x="214" y="125" width="22" height="22" rx="3" fill="#a8e0e5" stroke="#8fa3b8"/><rect x="239" y="125" width="22" height="22" rx="3" fill="#a8c8e5" stroke="#8fa3b8"/><rect x="64" y="150" width="22" height=