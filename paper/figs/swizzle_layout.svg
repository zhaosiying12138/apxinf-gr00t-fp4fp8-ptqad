<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500" font-family="system-ui,sans-serif"><rect width="940" height="500" fill="white"/><text x="20" y="28" font-size="15" font-weight="600" fill="#1a1a2e">NVFP4 块缩放的物理布局原理（静态示意，演示网格 8行×8 块）</text><text x="238" y="72" font-size="13" font-weight="600" text-anchor="middle" fill="#1a1a2e">逻辑视图 scale[row, block]</text><rect x="150" y="96" width="22" height="22" rx="3" fill="#e5a8a8" stroke="#8fa3b8"/><rect x="175" y="96" width="22" height="22" rx="3" fill="#e5bfa8" stroke="#8fa3b8"/><rect x="200" y="96" width="22" height="22" rx="3" fill="#e5d7a8" stroke="#8fa3b8"/><rect x="225" y="96" width="22" height="22" rx="3" fill="#dce5a8" stroke="#8fa3b8"/><rect x="250" y="96" width="22" height="22" rx="3" fill="#c4e5a8" stroke="#8fa3b8"/><rect x="275" y="96" width="22" height="22" rx="3" fill="#ade5a8" stroke="#8fa3b8"/><rect x="300" y="96" width="22" height="22" rx="3" fill="#a8e5ba" stroke="#8fa3b8"/><rect x="325" y="96" width="22" height="22" rx="3" fill="#a8e5d2" stroke="#8fa3b8"/><rect x="150" y="121" width="22" height="22" rx="3" fill="#e5d8a8" stroke="#8fa3b8"/><rect x="175" y="121" width="22" height="22" rx="3" fill="#dbe5a8" stroke="#8fa3b8"/><rect x="200" y="121" width="22" height="22" rx="3" fill="#c3e5a8" stroke="#8fa3b8"/><rect x="225" y="121" width="22" height="22" rx="3" fill="#ace5a8" stroke="#8fa3b8"/><rect x="250" y="121" width="22" height="22" rx="3" fill="#a8e5bb" stroke="#8fa3b8"/><rect x="275" y="121" width="22" height="22" rx="3" fill="#a8e5d3" stroke="#8fa3b8"/><rect x="300" y="121" width="22" height="22" rx="3" fill="#a8e0e5" stroke="#8fa3b8"/><rect x="325" y="121" width="22" height="22" rx="3" fill="#a8c8e5" stroke="#8fa3b8"/><rect x="150" y="146" width="22" height="22" rx="3" fill="#c2e5a8" stroke="#8fa3b8"/><rect x="175" y="146" width="22" height="22" rx="3" fill="#abe5a8" stroke="#8fa3b8"/><rect x="200" y="146" width="22" height="22" rx="3" fill="#a8e5bc" stroke="#8fa3b8"/><rect x="225" y="146" width="22" height="22" rx="3" fill="#a8e5d4" stroke="#8fa3b8"/><rect x="250" y="146" width="22" height="22" rx="3" fill="#a8dfe5" stroke="#8fa3b8"/><rect x="275" y="146" width="22" height="22" rx="3" fill="#a8c7e5" stroke="#8fa3b8"/><rect x="300" y="146" width="22" height="22" rx="3" fill="#a8b0e5" stroke="#8fa3b8"/><rect x="325" y="146" width="22" height="22" rx="3" fill="#b7a8e5" stroke="#8fa3b8"/><rect x="150" y="171" width="22" height="22" rx="3" fill="#a8e5bd" stroke="#8fa3b8"/><rect x="175" y="171" width="22" height="22" rx="3" fill="#a8e5d5" stroke="#8fa3b8"/><rect x="200" y="171" width="22" height="22" rx="3" fill="#a8dee5" stroke="#8fa3b8"/><rect x="225" y="171" width="22" height="22" rx="3" fill="#a8c6e5" stroke="#8fa3b8"/><rect x="250" y="171" width="22" height="22" rx="3" fill="#a8afe5" stroke="#8fa3b8"/><rect x="275" y="171" width="22" height="22" rx="3" fill="#b8a8e5" stroke="#8fa3b8"/><rect x="300" y="171" width="22" height="22" rx="3" fill="#d0a8e5" stroke="#8fa3b8"/><rect x="325" y="171" width="22" height="22" rx="3" fill="#e5a8e3" stroke="#8fa3b8"/><rect x="150" y="196" width="22" height="22" rx="3" fill="#a8dde5" stroke="#8fa3b8"/><rect x="175" y="196" width="22" height="22" rx="3" fill="#a8c5e5" stroke="#8fa3b8"/><rect x="200" y="196" width="22" height="22" rx="3" fill="#a8aee5" stroke="#8fa3b8"/><rect x="225" y="196" width="22" height="22" rx="3" fill="#b9a8e5" stroke="#8fa3b8"/><rect x="250" y="196" width="22" height="22" rx="3" fill="#d1a8e5" stroke="#8fa3b8"/><rect x="275" y="196" width="22" height="22" rx="3" fill="#e5a8e2" stroke="#8fa3b8"/><rect x="300" y="196" width="22" height="22" rx="3" fill="#e5a8cb" stroke="#8fa3b8"/><rect x="325" y="196" width="22" height="22" rx="3" fill="#e5a8b3" stroke="#8fa3b8"/><rect x="150" y="221" width="22" height="22" rx="3" fill="#a8ade5" stroke="#8fa3b8"/><rect x="175" y="221" width="22" height="22" rx="3" fill="#baa8e5" stroke="#8fa3b8"/><rect x="200" y="221" width="22" height="22" rx="3" fill="#d2a8e5" stroke="#8fa3b8"/><rect x="225" y="221" width="22" height="22" rx="3" fill="#e5a8e1" stroke="#8fa3b8"/><rect x="250" y="221" width="22" height="22" rx="3" fill="#e5a8c9" stroke="#8fa3b8"/><rect x="275" y="221" width="22" height="22" rx="3" fill="#e5a8b2" stroke="#8fa3b8"/><rect x="300" y="221" width="22" height="22" rx="3" fill="#e5b5a8" stroke="#8fa3b8"/><rect x="325" y="221" width="22" height="22" rx="3" fill="#e5cda8" stroke="#8fa3b8"/><rect x="150" y="246" width="22" height="22" rx="3" fill="#d3a8e5" stroke="#8fa3b8"/><rect x="175" y="246" width="22" height="22" rx="3" fill="#e5a8e0" stroke="#8fa3b8"/><rect x="200" y="246" width="22" height="22" rx="3" fill="#e5a8c8" stroke="#8fa3b8"/><rect x="225" y="246" width="22" height="22" rx="3" fill="#e5a8b1" stroke="#8fa3b8"/><rect x="250" y="246" width="22" height="22" rx="3" fill="#e5b6a8" stroke="#8fa3b8"/><rect x="275" y="246" width="22" height="22" rx="3" fill="#e5cea8" stroke="#8fa3b8"/><rect x="300" y="246" width="22" height="22" rx="3" fill="#e5e5a8" stroke="#8fa3b8"/><rect x="325" y="246" width="22" height="22" rx="3" fill="#cee5a8" stroke="#8fa3b8"/><rect x="150" y="271" width="22" height="22" rx="3" fill="#e5a8c7" stroke="#8fa3b8"/><rect x="175" y="271" width="22" height="22" rx="3" fill="#e5a8b0" stroke="#8fa3b8"/><rect x="200" y="271" width="22" height="22" rx="3" fill="#e5b7a8" stroke="#8fa3b8"/><rect x="225" y="271" width="22" height="22" rx="3" fill="#e5cfa8" stroke="#8fa3b8"/><rect x="250" y="271" width="22" height="22" rx="3" fill="#e4e5a8" stroke="#8fa3b8"/><rect x="275" y="271" width="22" height="22" rx="3" fill="#cde5a8" stroke="#8fa3b8"/><rect x="300" y="271" width="22" height="22" rx="3" fill="#b5e5a8" stroke="#8fa3b8"/><rect x="325" y="271" width="22" height="22" rx="3" fill="#a8e5b2" stroke="#8fa3b8"/><text x="136" y="184" font-size="12" text-anchor="middle" fill="#3c4a58" transform="rotate(-90 136 184)">行 r</text><text x="238" y="84" font-size="12" text-anchor="middle" fill="#3c4a58">块 b（每块管 16 个权重元素）</text><text x="358" y="184" font-size="11" fill="#5b6b7d">每格 = 1 字节 E4M3</text><text x="358" y="202" font-size="11" fill="#5b6b7d">（一个 16 元素块的幅度）</text><text x="470" y="120" font-size="12.5" fill="#0f6db3" font-family="Consolas,monospace">off(r,b) = PS*(r/128)</text><text x="470" y="140" font-size="12.5" fill="#0f6db3" font-family="Consolas,monospace">  + 512*(b/4)</text><text x="470" y="160" font-size="12.5" fill="#0f6db3" font-family="Consolas,monospace">  + 16*(r%32)</text><text x="470" y="180" font-size="12.5" fill="#0f6db3" font-family="Consolas,monospace">  + 4*((r/32)%4) + (b%4)</text><text x="470" y="204" font-size="11.5" fill="#3c4a58">PS = 512*ceil(KB/4)（一个 128 行 panel 的字节数）</text><text x="470" y="232" font-size="11.5" font-weight="600" fill="#1a1a2e">为什么要重排？</text><text x="470" y="252" font-size="11.5" fill="#3c4a58">• 一行的 4 个块 scale 在物理上连续（4 字节）</text><text x="470" y="270" font-size="11.5" fill="#3c4a58">• 32 行簇 × 4 块组 = 512B 连续区间</text><text x="470" y="288" font-size="11.5" fill="#3c4a58">• kernel 按此顺序消费：warp 合并访问，</text><text x="470" y="306" font-size="11.5" fill="#3c4a58">  每 lane 一次 16B 向量读还一行 4 块</text><text x="786" y="72" font-size="13" font-weight="600" text-anchor="middle" fill="#1a1a2e">物理缓冲（两个 512B slab）</text><text x="786" y="84" font-size="11" text-anchor="middle" fill="#0f6db3">slab 0（b/4=0）基址 0</text><rect x="738" y="92" width="105" height="205" fill="none" stroke="#0f6db3" stroke-dasharray="4 3"/><rect x="742" y="96" width="22" height="22" rx="3" fill="#e5a8a8" stroke="#8fa3b8"/><rect x="767" y="96" width="22" height="22" rx="3" fill="#e5bfa8" stroke="#8fa3b8"/><rect x="792" y="96" width="22" height="22" rx="3" fill="#e5d7a8" stroke="#8fa3b8"/><rect x="817" y="96" width="22" height="22" rx="3" fill="#dce5a8" stroke="#8fa3b8"/><rect x="742" y="121" width="22" height="22" rx="3" fill="#e5d8a8" stroke="#8fa3b8"/><rect x="767" y="121" width="22" height="22" rx="3" fill="#dbe5a8" stroke="#8fa3b8"/><rect x="792" y="121" width="22" height="22" rx="3" fill="#c3e5a8" stroke="#8fa3b8"/><rect x="817" y="121" width="22" height="22" rx="3" fill="#ace5a8" stroke="#8fa3b8"/><rect x="742" y="146" width="22" height="22" rx="3" fill="#c2e5a8" stroke="#8fa3b8"/><rect x="767" y="146" width="22" height="22" rx="3" fill="#abe5a8" stroke="#8fa3b8"/><rect x="792" y="146" width="22" height="22" rx="3" fill="#a8e5bc" stroke="#8fa3b8"/><rect x="817" y="146" width="22" height="22" rx="3" fill="#a8e5d4" stroke="#8fa3b8"/><rect x="742" y="171" width="22" height="22" rx="3" fill="#a8e5bd" stroke="#8fa3b8"/><rect x="767" y="171" width="22" height="22" rx="3" fill="#a8e5d5" stroke="#8fa3b8"/><rect x="792" y="171" width="22" height="22" rx="3" fill="#a8dee5" stroke="#8fa3b8"/><rect x="817" y="171" width="22" height="22" rx="3" fill="#a8c6e5" stroke="#8fa3b8"/><rect x="742" y="196" width="22" height="22" rx="3" fill="#a8dde5" stroke="#8fa3b8"/><rect x="767" y="196" width="22" height="22" rx="3" fill="#a8c5e5" stroke="#8fa3b8"/><rect x="792" y="196" width="22" height="22" rx="3" fill="#a8aee5" stroke="#8fa3b8"/><rect x="817" y="196" width="22" height="22" rx="3" fill="#b9a8e5" stroke="#8fa3b8"/><rect x="742" y="221" width="22" height="22" rx="3" fill="#a8ade5" stroke="#8fa3b8"/><rect x="767" y="221" width="22" height="22" rx="3" fill="#baa8e5" stroke="#8fa3b8"/><rect x="792" y="221" width="22" height="22" rx="3" fill="#d2a8e5" stroke="#8fa3b8"/><rect x="817" y="221" width="22" height="22" rx="3" fill="#e5a8e1" stroke="#8fa3b8"/><rect x="742" y="246" width="22" height="22" rx="3" fill="#d3a8e5" stroke="#8fa3b8"/><rect x="767" y="246" width="22" height="22" rx="3" fill="#e5a8e0" stroke="#8fa3b8"/><rect x="792" y="246" width="22" height="22" rx="3" fill="#e5a8c8" stroke="#8fa3b8"/><rect x="817" y="246" width="22" height="22" rx="3" fill="#e5a8b1" stroke="#8fa3b8"/><rect x="742" y="271" width="22" height="22" rx="3" fill="#e5a8c7" stroke="#8fa3b8"/><rect x="767" y="271" width="22" height="22" rx="3" fill="#e5a8b0" stroke="#8fa3b8"/><rect x="792" y="271" width="22" height="22" rx="3" fill="#e5b7a8" stroke="#8fa3b8"/><rect x="817" y="271" width="22" height="22" rx="3" fill="#e5cfa8" stroke="#8fa3b8"/><text x="926" y="84" font-size="11" text-anchor="middle" fill="#0f6db3">slab 1（b/4=1）基址 512</text><rect x="878" y="92" width="105" height="205" fill="none" stroke="#0f6db3" stroke-dasharray="4 3"/><rect x="882" y="96" width="22" height="22" rx="3" fill="#c4e5a8" stroke="#8fa3b8"/><rect x="907" y="96" width="22" height="22" rx="3" fill="#ade5a8" stroke="#8fa3b8"/><rect x="932" y="96" width="22" height="22" rx="3" fill="#a8e5ba" stroke="#8fa3b8"/><rect x="957" y="96" width="22" height="22" rx="3" fill="#a8e5d2" stroke="#8fa3b8"/><rect x="882" y="121" width="22" height="22" rx="3" fill="#a8e5bb" stroke="#8fa3b8"/><rect x="907" y="121" width="22" height="22" rx="3" fill="#a8e5d3" stroke="#8fa3b8"/><rect x="932" y="121" width="22" height="22" rx="3" fill="#a8e0e5" stroke="#8fa3b8"/><rect x="957" y="121" width="22" height="22" rx="3" fill="#a8c8e5" stroke="#8fa3b8"/><rect x="882" y="146" width="22" height="22" rx="3" fill="#a8dfe5" stroke="#8fa3b8"/><rect x="907" y="146" width="22" height="22" rx="3" fill="#a8c7e5" stroke="#8fa3b8"/><rect x="932" y="146" width="22" height="22" rx="3" fill="#a8b0e5" stroke="#8fa3b8"/><rect x="957" y="146" width="22" height="22" rx="3" fill="#b7a8e5" stroke="#8fa3b8"/><rect x="882" y="171" width="22" height="22" rx="3" fill="#a8afe5" stroke="#8fa3b8"/><rect x="907" y="171" width="22" height="22" rx="3" fill="#b8a8e5" stroke="#8fa3b8"/><rect x="932" y="171" width="22" height="22" rx="3" fill="#d0a8e5" stroke="#8fa3b8"/><rect x="957" y="171" width="22" height="22" rx="3" fill="#e5a8e3" stroke="#8fa3b8"/><rect x="882" y="196" width="22" height="22" rx="3" fill="#d1a8e5" stroke="#8fa3b8"/><rect x="907" y="196" width="22" height="22" rx="3" fill="#e5a8e2" stroke="#8fa3b8"/><rect x="932" y="196" width="22" height="22" rx="3" fill="#e5a8cb" stroke="#8fa3b8"/><rect x="957" y="196" width="22" height="22" rx="3" fill="#e5a8b3" stroke="#8fa3b8"/><rect x="882" y="221" width="22" height="22" rx="3" fill="#e5a8c9" stroke="#8fa3b8"/><rect x="907" y="221" width="22" height="22" rx="3" fill="#e5a8b2" stroke="#8fa3b8"/><rect x="932" y="221" width="22" height="22" rx="3" fill="#e5b5a8" stroke="#8fa3b8"/><rect x="957" y="221" width="22" height="22" rx="3" fill="#e5cda8" stroke="#8fa3b8"/><rect x="882" y="246" width="22" height="22" rx="3" fill="#e5b6a8" stroke="#8fa3b8"/><rect x="907" y="246" width="22" height="22" rx="3" fill="#e5cea8" stroke="#8fa3b8"/><rect x="932" y="246" width="22" height="22" rx="3" fill="#e5e5a8" stroke="#8fa3b8"/><rect x="957" y="246" width="22" height="22" rx="3" fill="#cee5a8" stroke="#8fa3b8"/><rect x="882" y="271" width="22" height="22" rx="3" fill="#e4e5a8" stroke="#8fa3b8"/><rect x="907" y="271" width="22" height="22" rx="3" fill="#cde5a8" stroke="#8fa3b8"/><rect x="932" y="271" width="22" height="22" rx="3" fill="#b5e5a8" stroke="#8fa3b8"/><rect x="957" y="271" width="22" height="22" rx="3" fill="#a8e5b2" stroke="#8fa3b8"/><text x="742" y="294" font-size="11" fill="#5b6b7d">同色 = 同一个逻辑单元；一列 4 格 = 一行的连续 4 字节</text><text x="150" y="356" font-size="12" font-weight="600" fill="#1a1a2e">实例计算（演示网格，r&lt;32 故交错项为 0）：</text><text x="150" y="378" font-size="12" fill="#3c4a58" font-family="Consolas,monospace">(r=0, b=0) -> 字节偏移 0</text><text x="150" y="398" font-size="12" fill="#3c4a58" font-family="Consolas,monospace">(r=0, b=5) -> 字节偏移 513</text><text x="150" y="418" font-size="12" fill="#3c4a58" font-family="Consolas,monospace">(r=3, b=2) -> 字节偏移 50</text><text x="150" y="438" font-size="12" fill="#3c4a58" font-family="Consolas,monospace">(r=7, b=7) -> 字节偏移 627</text><text x="470" y="400" font-size="11" fill="#5b6b7d">真实尺寸：128 行/panel；行内按 32 行簇四组交锔；</text><text x="470" y="418" font-size="11" fill="#5b6b7d">本图为 8×8 缩小演示。布局由单字节探针实验测定（§3.1）。</text></svg>