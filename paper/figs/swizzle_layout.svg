 x="64" y="225" width="22" height="22" rx="3" fill="#a8ade5" stroke="#8fa3b8"/><rect x="89" y="225" width="22" height="22" rx="3" fill="#baa8e5" stroke="#8fa3b8"/><rect x="114" y="225" width="22" height="22" rx="3" fill="#d2a8e5" stroke="#8fa3b8"/><rect x="139" y="225" width="22" height="22" rx="3" fill="#e5a8e1" stroke="#8fa3b8"/><rect x="164" y="225" width="22" height="22" rx="3" fill="#e5a8c9" stroke="#8fa3b8"/><rect x="189" y="225" width="22" height="22" rx="3" fill="#e5a8b2" stroke="#8fa3b8"/><rect x="214" y="225" width="22" height="22" rx="3" fill="#e5b5a8" stroke="#8fa3b8"/><rect x="239" y="225" width="22" height="22" rx="3" fill="#e5cda8" stroke="#8fa3b8"/><rect x="64" y="250" width="22" height="22" rx="3" fill="#d3a8e5" stroke="#8fa3b8"/><rect x="89" y="250" width="22" height="22" rx="3" fill="#e5a8e0" stroke="#8fa3b8"/><rect x="114" y="250" width="22" height="22" rx="3" fill="#e5a8c8" stroke="#8fa3b8"/><rect x="139" y="250" width="22" height="22" rx="3" fill="#e5a8b1" stroke="#8fa3b8"/><rect x="164" y="250" width="22" height="22" rx="3" fill="#e5b6a8" stroke="#8fa3b8"/><rect x="189" y="250" width="22" height="22" rx="3" fill="#e5cea8" stroke="#8fa3b8"/><rect x="214" y="250" width="22" height="22" rx="3" fill="#e5e5a8" stroke="#8fa3b8"/><rect x="239" y="250" width="22" height="22" rx="3" fill="#cee5a8" stroke="#8fa3b8"/><rect x="64" y="275" width="22" height="22" rx="3" fill="#e5a8c7" stroke="#8fa3b8"/><rect x="89" y="275" width="22" height="22" rx="3" fill="#e5a8b0" stroke="#8fa3b8"/><rect x="114" y="275" width="22" height="22" rx="3" fill="#e5b7a8" stroke="#8fa3b8"/><rect x="139" y="275" width="22" height="22" rx="3" fill="#e5cfa8" stroke="#8fa3b8"/><rect x="164" y="275" width="22" height="22" rx="3" fill="#e4e5a8" stroke="#8fa3b8"/><rect x="189" y="275" width="22" height="22" rx="3" fill="#cde5a8" stroke="#8fa3b8"/><rect x="214" y="275" width="22" height="22" rx="3" fill="#b5e5a8" stroke="#8fa3b8"/><rect x="239" y="275" width="22" height="22" rx="3" fill="#a8e5b2" stroke="#8fa3b8"/><text x="56" y="115" font-size="10" text-anchor="end" fill="#5b6b7d">0</text><text x="56" y="290" font-size="10" text-anchor="end" fill="#5b6b7d">7</text><text x="75" y="92" font-size="10" text-anchor="middle" fill="#5b6b7d">0</text><text x="250" y="92" font-size="10" text-anchor="middle" fill="#5b6b7d">7</text><text x="24" y="200" font-size="11" fill="#3c4a58" text-anchor="middle" transform="rotate(-90 24 200)">行 r</text><text x="164" y="76" font-size="10.5" text-anchor="middle" fill="#3c4a58">块 b（每块管 16 个权重元素）</text><text x="64" y="326" font-size="11" fill="#5b6b7d">每格 = 1 字节 E4M3 scale</text><text x="330" y="108" font-size="12.5" fill="#0f6db3" font-family="Noto Sans Mono CJK SC,Consolas,monospace">off(r,b) = PS*(r/128)</text><text x="330" y="130" font-size="12.5" fill="#0f6db3" font-family="Noto Sans Mono CJK SC,Consolas,monospace">  + 512*(b/4)</text><text x="330" y="152" font-size="12.5" fill="#0f6db3" font-family="Noto Sans Mono CJK SC,Consolas,monospace">  + 16*(r%32)</text><text x="330" y="174" font-size="12.5" fill="#0f6db3" font-family="Noto Sans Mono CJK SC,Consolas,monospace">  + 4*((r/32)%4) + (b%4)</text><text x="330" y="196"> </text><text x="330" y="218" font-size="12.5" fill="#0f6db3" font-family="Noto Sans Mono CJK SC,Consolas,monospace">PS = 512*ceil(KB/4)</text><text x="330" y="240" font-size="12.5" fill="#0f6db3" font-family="Noto Sans Mono CJK SC,Consolas,monospace">（一个 128 行 panel 的字节数）</text><text x="330" y="280" font-size="11.5" font-weight="600" fill="#1a1a2e">为什么要重排？</text><text x="330" y="300" font-size="11.5" fill="#3c4a58">• 一行的 4 个块 scale 在物理上连续</text><text x="330" y="317" font-size="11.5" fill="#3c4a58">  （4 字节）；每线程一次 16B 向量读取</text><text x="330" y="334" font-size="11.5" fill="#3c4a58">• 32 行簇 × 4 块组 = 512B 连续区间，</text><text x="330" y="351" font-size="11.5" fill="#3c4a58">  一个 warp 的 32 线程恰好合并消费</text><text x="330" y="368" font-size="11.5" fill="#3c4a58">• 若按行主序存放，同一行相邻 4 块</text><text x="330" y="385" font-size="11.5" fill="#3c4a58">  的 scale 会相距 KB 字节，读取跨缓存行</text><rect x="603" y="93" width="114" height="214" fill="none" stroke="#0f6db3" stroke-dasharray="4 3"/><text x="660" y="90" font-size="10.5" text-anchor="middle" fill="#0f6db3">slab 0 · 基址 0</text><rect x="610" y="100" width="22" height="22" rx="3" fill="#e5a8a8" stroke="#8fa3b8"/><rect x="635" y="100" width="22" height="22" rx="3" fill="#e5bfa8" stroke="#8fa3b8"/><rect x="660" y="100" width="22" height="22" rx="3" fill="#e5d7a8" stroke="#8fa3b8"/><rect x="685" y="100" width="22" height="22" rx="3" fill="#dce5a8" stroke="#8fa3b8"/><rect x="610" y="125" width="22" height="22" rx="3" fill="#e5d8a8" stroke="#8fa3b8"/><rect x="635" y="125" width="22" height="22" rx="3" fill="#dbe5a8" stroke="#8fa3b8"/><rect x="660" y="125" width="22" height="22" rx="3" fill="#c3e5a8" stroke="#8fa3b8"/><rect x="685" y="125" width="22" height="22" rx="3" fill="#ace5a8" stroke="#8fa3b8"/><rect x="610" y="150" width="22" height="22" rx="3" fill="#c2e5a8" stroke="#8fa3b8"/><rect x="635" y="150" width="22" height="22" rx="3" fill="#abe5a8" stroke="#8fa3b8"/><rect x="660" y="150" width="22" height="22" rx="3" fill="#a8e5bc" stroke="#8fa3b8"/><rect x="685" y="150" width="22" height="22" rx="3" fill="#a8e5d4" stroke="#8fa3b8"/><rect x="610" y="175" width="22" height="22" rx="3" fill="#a8e5bd" stroke="#8fa3b8"/><rect x="635" y="175" width="22" height="22" rx="3" fill="#a8e5d5" stroke="#8fa3b8"/><rect x="660" y="175" width="22" height="22" rx="3" fill="#a8dee5" stroke="#8fa3b8"/><rect x="685" y="175" width="22" height="22" rx="3" fill="#a8c6e5" stroke="#8fa3b8"/><rect x="610" y="200" width="22" height="22" rx="3" fill="#a8dde5" stroke="#8fa3b8"/><rect x="635" y="200" width="22" height="22" rx="3" fill="#a8c5e5" stroke="#8fa3b8"/><rect x="660" y="200" width="22" height="22" rx="3" fill="#a8aee5" stroke="#8fa3b8"/><rect x="685" y="200" width="22" height="22" rx="3" fill="#b9a8e5" stroke="#8fa3b8"/><rect x="610" y="225" width="22" height="22" rx="3" fill="#a8ade5" stroke="#8fa3b8"/><rect x="635" y="225" width="22" height="22" rx="3" fill="#baa8e5" stroke="#8fa3b8"/><rect x="660" y="225" width="22" height="22" rx="3" fill="#d2a8e5" stroke="#8fa3b8"/><rect x="685" y="225" width="22" height="22" rx="3" fill="#e5a8e1" stroke="#8fa3b8"/><rect x="610" y="250" width="22" height="22" rx="3" fill="#d3a8e5" stroke="#8fa3b8"/><rect x="635" y="250" width="22" height="22" rx="3" fill="#e5a8e0" stroke="#8fa3b8"/><rect x="660" y="250" width="22" height="22" rx="3" fill="#e5a8c8" stroke="#8fa3b8"/><rect x="685" y="250" width="22" height="22" rx="3" fill="#e5a8b1" stroke="#8fa3b8"/><rect x="610" y="275" width="22" height="22" rx="3" fill="#e5a8c7" stroke="#8fa3b8"/><rect x="635" y="275" width="22" height="22" rx="3" fill="#e5a8b0" stroke="#8fa3b8"/><rect x="660" y="275" width="22" height="22" rx="3" fill="#e5b7a8" stroke="#8fa3b8"/><rect x="685" y="275" width="22" height="22" rx="3" fill="#e5cfa8" stroke="#8fa3b8"/><rect x="743" y="93" width="114" height="214" fill="none" stroke="#0f6db3" stroke-dasharray="4 3"/><text x="800" y="90" font-size="10.5" text-anchor="middle" fill="#0f6db3">slab 1 · 基址 512</text><rect x="750" y="100" width="22" height="22" rx="3" fill="#c4e5a8" stroke="#8fa3b8"/><rect x="775" y="100" width="22" height="22" rx="3" fill="#ade5a8" stroke="#8fa3b8"/><rect x="800" y="100" width="22" height="22" rx="3" fill="#a8e5ba" stroke="#8fa3b8"/><rect x="825" y="100" width="22" height="22" rx="3" fill="#a8e5d2" stroke="#8fa3b8"/><rect x="750" y="125" width="22" height="22" rx="3" fill="#a8e5bb" stroke="#8fa3b8"/><rect x="775" y="125" width="22" height="22" rx="3" fill="#a8e5d3" stroke="#8fa3b8"/><rect x="800" y="125" width="22" height="22" rx="3" fill="#a8e0e5" stroke="#8fa3b8"/><rect x="825" y="125" width="22" height="22" rx="3" fill="#a8c8e5" stroke="#8fa3b8"/><rect x="750" y="150" width="22" height="22" rx="3" fill="#a8dfe5" stroke="#8fa3b8"/><rect x="775" y="150" width="22" height="22" rx="3" fill="#a8c7e5" stroke="#8fa3b8"/><rect x="800" y="150" width="22" height="22" rx="3" fill="#a8b0e5" stroke="#8fa3b8"/><rect x="825" y="150" width="22" height="22" rx="3" fill="#b7a8e5" stroke="#8fa3b8"/><rect x="750" y="175" width="22" height="22" rx="3" fill="#a8afe5" stroke="#8fa3b8"/><rect x="775" y="175" width="22" height="22" rx="3" fill="#b8a8e5" stroke="#8fa3b8"/><rect x="800" y="175" width="22" height="22" rx="3" fill="#d0a8e5" stroke="#8fa3b8"/><rect x="825" y="175" width="22" height="22" rx="3" fill="#e5a8e3" stroke="#8fa3b8"/><rect x="750" y="200" width="22" height="22" rx="3" fill="#d1a8e5" stroke="#8fa3b8"/><rect x="775" y="200" width="22" height="22" rx="3" fill="#e5a8e2" stroke="#8fa3b8"/><rect x="800" y="200" width="22" height="22" rx="3" fill="#e5a8cb" stroke="#8fa3b8"/><rect x="825" y="200" width="22" height="22" rx="3" fill="#e5a8b3" stroke="#8fa3b8"/><rect x="750" y="225" width="22" height="22" rx="3" fill="#e5a8c9" stroke="#8fa3b8"/><rect x="775" y="225" width="22" height="22" rx="3" fill="#e5a8b2" stroke="#8fa3b8"/><rect x="800" y="225" width="22" height="22" rx="3" fill="#e5b5a8" stroke="#8fa3b8"/><rect x="825" y="225" width="22" height="22" rx="3" fill="#e5cda8" stroke="#8fa3b8"/><rect x="750" y="250" width="22" height="22" rx="3" fill="#e5b6a8" stroke="#8fa3b8"/><rect x="775" y="250" width="22" height="22" rx="3" fill="#e5cea8" stroke="#8fa3b8"/><rect x="800" y="250" width="22" height="22" rx="3" fill="#e5e5a8" stroke="#8fa3b8"/><rect x="825" y="250" width="22" height="22" rx="3" fill="#cee5a8" stroke="#8fa3b8"/><rect x="750" y="275" width="22" height="22" rx="3" fill="#e4e5a8" stroke="#8fa3b8"/><rect x="775" y="275" width="22" height="22" rx="3" fill="#cde5a8" stroke="#8fa3b8"/><rect x="800" y="275" width="22" height="22" rx="3" fill="#b5e5a8" stroke="#8fa3b8"/><rect x="825" y="275" width="22" height="22" rx="3" fill="#a8e5b2" stroke="#8fa3b8"/><text x="580" y="326" font-size="10.5" fill="#5b6b7d">同色 = 同一逻辑单元；一列 4 格 = 该行连续 4 字节</text><text x="64" y="360" font-size="11.5" font-weight="600" fill="#1a1a2e">实例（演示网格 r&lt;32，交错项为 0）</text><text x="64" y="380" font-size="12" fill="#3c4a58" font-family="Noto Sans Mono CJK SC,Consolas,monospace">(r=0, b=0) -> 字节 0</text><text x="64" y="399" font-size="12" fill="#3c4a58" font-family="Noto Sans Mono CJK SC,Consolas,monospace">(r=0, b=5) -> 字节 513</text><text x="64" y="418" font-size="12" fill="#3c4a58" font-family="Noto Sans Mono CJK SC,Consolas,monospace">(r=3, b=2) -> 字节 50</text><text x="64" y="437" font-size="12" fill="#3c4a58" font-family="Noto Sans Mono CJK SC,Consolas,monospace">(r=7, b=7) -> 字节 627</text><text x="330" y="484" font-size="10.5" fill="#5b6b7d">真实尺寸：128 行/panel，行内按 32 行簇四组交错；布局由单字节探针实验测定（§3.1）。</text></svg>