<rect x="830" y="257" width="56" height="46" fill="#e6def2" stroke="none" rx="5"/>
<text x="858" y="276" fill="#183c4d" font-size="13" font-weight="400" text-anchor="middle"><tspan dy="0" font-size="13">13 B</tspan></text>
<text x="858" y="294" fill="#183c4d" font-size="11" font-weight="400" text-anchor="middle"><tspan dy="0" font-size="11">96,1</tspan></text>
<rect x="892" y="257" width="56" height="46" fill="#e6def2" stroke="none" rx="5"/>
<text x="920" y="276" fill="#183c4d" font-size="13" font-weight="400" text-anchor="middle"><tspan dy="0" font-size="13">14 B</tspan></text>
<text x="920" y="294" fill="#183c4d" font-size="11" font-weight="400" text-anchor="middle"><tspan dy="0" font-size="11">96,2</tspan></text>
<rect x="954" y="257" width="56" height="46" fill="#e6def2" stroke="none" rx="5"/>
<text x="982" y="276" fill="#183c4d" font-size="13" font-weight="400" text-anchor="middle"><tspan dy="0" font-size="13">15 B</tspan></text>
<text x="982" y="294" fill="#183c4d" font-size="11" font-weight="400" text-anchor="middle"><tspan dy="0" font-size="11">96,3</tspan></text>
<text x="520" y="375" fill="#183c4d" font-size="13" font-weight="400" text-anchor="start"><tspan dy="0" font-size="13">第 16～31 字节依次放 r=1,33,65,97 的 b=0…3。</tspan></text>
<text x="520" y="399" fill="#183c4d" font-size="13" font-weight="400" text-anchor="start"><tspan dy="0" font-size="13">b=4…7 的下一个 tile 从字节 512 开始。</tspan></text>
<rect x="30" y="429" width="1020" height="112" fill="#f1f6f8" stroke="none" rx="5"/>
<text x="48" y="457" fill="#2368a0" font-size="16" font-weight="400" text-anchor="start"><tspan dy="0" font-size="16">K′ = 16 × ceil(K / 16)；KB = K′ / 16；P = 512 × ceil(KB / 4)。</tspan></text>
<text x="48" y="487" fill="#183c4d" font-size="18" font-weight="400" text-anchor="start"><tspan dy="0" font-size="18">offset(r,b) = P × (r // 128) + 512 × (b // 4)</tspan></text>
<text x="48" y="517" fill="#183c4d" font-size="17" font-weight="400" text-anchor="start"><tspan dy="0" font-size="17">                         + 16 × (r % 32) + 4 × ((r // 32) % 4) + (b % 4)</tspan></text>
<text x="30" y="573" fill="#183c4d" font-size="15" font-weight="400" text-anchor="start"><tspan dy="0" font-size="15">例：(0,0)→0；(32,0)→4；(1,0)→16；(3,2)→50；(0,5)→513。</tspan></text>
<text x="30" y="603" fill="#183c4d" font-size="13" font-weight="400" text-anchor="start"><tspan dy="0" font-size="13">这里只说明可验证的布局映射。普通行主序的同一行相邻块本来就连续；不据此猜测内部 warp 读法。</tspan></text>
</svg>