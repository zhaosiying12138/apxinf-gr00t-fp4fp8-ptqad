<text x="370" y="332" fill="#183c4d" font-size="14" font-weight="400" text-anchor="middle"><tspan dy="0" font-size="14">b=3</tspan></text>
<text x="460" y="206" fill="#2368a0" font-size="35" font-weight="400" text-anchor="start"><tspan dy="0" font-size="35">→</tspan></text>
<text x="520" y="110" fill="#2368a0" font-size="18" font-weight="600" text-anchor="start"><tspan dy="0" font-size="18">物理缓冲：前 16 个字节</tspan></text>
