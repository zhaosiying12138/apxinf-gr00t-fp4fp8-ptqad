<text x="734" y="189" fill="#183c4d" font-size="11" font-weight="400" text-anchor="middle"><tspan dy="0" font-size="11">0,3</tspan></text>
<rect x="768" y="152" width="56" height="46" fill="#d9eee9" stroke="none" rx="5"/>
