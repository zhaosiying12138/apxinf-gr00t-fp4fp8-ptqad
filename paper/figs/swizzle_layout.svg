<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640" role="img" aria-label="NVFP4 scale：从逻辑索引到物理字节" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif">
<rect width="100%" height="100%" fill="white"/>
<text x="30" y="38" fill="#183c4d" font-size="23" font-weight="700" text-anchor="start">NVFP4 scale：从逻辑索引到物理字节</text>
<text x="30" y="67" fill="#667c87" font-size="13" font-weight="400" text-anchor="start">每个逻辑 scale 管理 16 个连续权重；128 行 × 4 个 scale 块组成 512 字节 tile。</text>
<text x="30" y="110" fill="#2368a0" font-size="18" font-weight="600" text-anchor="start">逻辑 scale[r, b]：同一行的 4 个块</text>
<text x="34" y="159" fill="#183c4d" font-size="15" font-weight="400" text-anchor="start">r = 0</text>
<rect x="125" y="132" width="64" height="40" fill="#d8e9f4" stroke="none" rx="5"/>
<text x="157" y="158" fill="#183c4d" font-size="14" font-weight="400" text-anchor="middle">b=0</text>
<rect x="196" y="132" width="64" height="40" fill="#d8e9f4" stroke="none" rx="5"/>
<text x="228" y="158" fill="#183c4d" font-size="14" font-weight="400" text-anchor="middle">b=1</text>
<rect x="267" y="132" width="64" height="40" fill="#d8e9f4" stroke="none" rx="5"/>
<text x="299" y="158" fill="#183c4d" font-size="14" font-weight="400" text-anchor="middle">b=2</text>
<rect x="338" y="132" width="64" height="40" fill="#d8e9f4" stroke="none" rx="5"/>
<text x="370" y="158" fill="#183c4d" font-size="14" font-weight="400" text-anchor="middle">b=3</text>
<text x="34" y="217" fill="#183c4d" font-size="15" font-weight="400" text-anchor="start">r = 32</text>
<rect x="125" y="190" width="64" height="40" fill="#d9eee9" stroke="none" rx="5"/>
<text x="157" y="216" fill="#183c4d" font-size="14" font-weight="400" text-anchor="middle">b=0</text>
<rect x="196" y="190" width="64" height="40" fill="#d9eee9" stroke="none" rx="5"/>
<text x="228" y="216" fill="#183c4d" font-size="14" font-weight="400" text-anchor="middle">b=1</text>
<rect x="267" y="190" width="64" height="40" fill="#d9eee9" stroke="none" rx="5"/>
<text x="299" y="216" fill="#183c4d" font-size="14" font-weight="400" text-anchor="middle">b=2</text>
<rect x="338" y="190" width="64" height="40" fill="#d9eee9" stroke="none" rx="5"/>
<text x="370" y="216" fill="#183c4d" font-size="14" font-weight="400" text-anchor="middle">b=3</text>
<text x="34" y="275" fill="#183c4d" font-size="15" font-weight="400" text-anchor="start">r = 64</text>
<rect x="125" y="248" width="64" height="40" fill="#f6e7cb" stroke="none" rx="5"/>
<text x="157" y="274" fill="#183c4d" font-size="14" font-weight="400" text-anchor="middle">b=0</text>
<rect x="196" y="248" width="64" height="40" fill="#f6e7cb" stroke="none" rx="5"/>
<text x="228" y="274" fill="#183c4d" font-size="14" font-weight="400" text-anchor="middle">b=1</text>
<rect x="267" y="248" width="64" height="40" fill="#f6e7cb" stroke="none" rx="5"/>
<text x="299" y="274" fill="#183c4d" font-size="14" font-weight="400" text-anchor="middle">b=2</text>
<rect x="338" y="248" width="64" height="40" fill="#f6e7cb" stroke="none" rx="5"/>
<text x="370" y="274" fill="#183c4d" font-size="14" font-weight="400" text-anchor="middle">b=3</text>
<text x="34" y="333" fill="#183c4d" font-size="15" font-weight="400" text-anchor="start">r = 96</text>
<rect x="125" y="306" width="64" height="40" fill="#e6def2" stroke="none" rx="5"/>
<text x="157" y="332" fill="#183c4d" font-size="14" font-weight="400" text-anchor="middle">b=0</text>
<rect x="196" y="306" width="64" height="40" fill="#e6def2" stroke="none" rx="5"/>
<text x="228" y="332" fill="#183c4d" font-size="14" font-weight="400" text-anchor="middle">b=1</text>
<rect x="267" y="306" width="64" height="40" fill="#e6def2" stroke="none" rx="5"/>
<text x="299" y="332" fill="#183c4d" font-size="14" font-weight="400" text-anchor="middle">b=2</text>
<rect x="338" y="306" width="64" height="40" fill="#e6def2" stroke="none" rx="5"/>
<text x="370" y="332" fill="#183c4d" font-size="14" font-weight="400" text-anchor="middle">b=3</text>
<text x="460" y="206" fill="#2368a0" font-size="35" font-weight="400" text-anchor="start">→</text>
<text x="520" y="110" fill="#2368a0" font-size="18" font-weight="600" text-anchor="start">物理缓冲：前 16 个字节</text>
<rect x="520" y="152" width="56" height="46" fill="#d8e9f4" stroke="none" rx="5"/>
<text x="548" y="171" fill="#183c4d" font-size="13" font-weight="400" text-anchor="middle">0 B</text>
<text x="548" y="189" fill="#183c4d" font-size="11" font-weight="400" text-anchor="middle">0,0</text>
<rect x="582" y="152" width="56" height="46" fill="#d8e9f4" stroke="none" rx="5"/>
<text x="610" y="171" fill="#183c4d" font-size="13" font-weight="400" text-anchor="middle">1 B</text>
<text x="610" y="189" fill="#183c4d" font-size="11" font-weight="400" text-anchor="middle">0,1</text>
<rect x="644" y="152" width="56" height="46" fill="#d8e9f4" stroke="none" rx="5"/>
<text x="672" y="171" fill="#183c4d" font-size="13" font-weight="400" text-anchor="middle">2 B</text>
<text x="672" y="189" fill="#183c4d" font-size="11" font-weight="400" text-anchor="middle">0,2</text>
<rect x="706" y="152" width="56" height="46" fill="#d8e9f4" stroke="none" rx="5"/>
