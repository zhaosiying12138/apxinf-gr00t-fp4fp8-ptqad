<text x="548" y="294" fill="#183c4d" font-size="11" font-weight="400" text-anchor="middle"><tspan dy="0" font-size="11">64,0</tspan></text>
<rect x="582" y="257" width="56" height="46" fill="#f6e7cb" stroke="none" rx="5"/>
