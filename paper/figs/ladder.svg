<text x="30" y="603" fill="#183c4d" font-size="14" font-weight="400" text-anchor="start"><tspan dy="0" font-size="14">两条续训分支共享 QAD 起点与演示更新预算；OPD 另用学生访问数据、教师标签和探针计算。</tspan></text>
